[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ccxt-tiktape"
dynamic = ["version"]
description = "Full Hyperliquid OHLCV history in CCXT: a drop-in ccxt.hyperliquid subclass served by TikTape, past the 5000-candle limit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "TikTape", email = "evan@tiktape.xyz" }]
keywords = ["ccxt", "hyperliquid", "ohlcv", "candles", "historical-data", "backtesting", "crypto", "funding-rate"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["ccxt>=4.4"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://tiktape.xyz/?utm_source=pypi&utm_medium=package&utm_campaign=ccxt-tiktape"
Source = "https://github.com/tiktape/ccxt-tiktape"
Issues = "https://github.com/tiktape/ccxt-tiktape/issues"
"API reference" = "https://tiktape.xyz/openapi.yaml"

[tool.hatch.version]
path = "src/ccxt_tiktape/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ccxt_tiktape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
